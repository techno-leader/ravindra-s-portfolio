<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Components — one a day · Ravindra Pratap</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* monochrome only. colour is an event, not a surface. */
    --ink:#0d0d10;
    --ink-2:#3b3b42;
    --mut:#8c8c96;
    --line:#e8e8ec;
    --line-2:#f1f1f4;
    --sunk:#fafafa;
    --paper:#ffffff;

    /* the single colour in the system, spent only on live interaction:
       focus rings, an engaged zoom, a control being held. */
    --grad:linear-gradient(96deg,
      oklch(.78 .16 28) 0%,
      oklch(.83 .15 92) 33%,
      oklch(.74 .13 202) 67%,
      oklch(.66 .19 296) 100%);

    --r-sm:8px;
    --r-md:14px;
    --r-lg:20px;
    --r-pill:99px;

    --t-body:18px;
    --t-sub:24px;
    --t-head:56px;

    /* one easing for entrances/exits, one for direct manipulation */
    --ease:cubic-bezier(.32,.72,0,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scrollbar-gutter:stable;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.lock{overflow:hidden;}
  ::selection{background:#e9e9ee;}

  .mono{
    font-family:ui-monospace,Menlo,monospace;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 44px;}

  /* ---------- site chrome ----------
     The lab had no header and no footer — it was reachable only from one line
     of About prose and had no way back. Both are ported from the cluster, but
     built out of THIS page's tokens (--ink #0d0d10, --line #e8e8ec, Inter),
     not case-viewryt's: the lab is a deliberately separate monochrome system
     and must not start importing the other one variable by variable. */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 44px;font-size:13px;letter-spacing:.02em;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    transform:translateY(0);
    transition:transform .32s var(--ease-out);
  }
  /* Pinned for the first 5% of the document, then tucks on a downward scroll
     and returns on an upward one — see the header IIFE at the foot of the
     page. -100% takes the border with it. */
  nav.is-tucked{transform:translateY(-100%);}
  /* A tucked bar must never strand keyboard focus off-screen. */
  nav:focus-within{transform:translateY(0);}
  nav .logo{font-weight:600;text-decoration:none;color:var(--ink);opacity:1;}
  nav .logo img{display:block;height:28px;width:auto;}
  nav .links{display:flex;gap:26px;}
  /* 44px minimum touch target — the padding is on the link, not the bar */
  nav a{
    color:var(--ink);text-decoration:none;opacity:.65;transition:opacity .2s;
    display:inline-flex;align-items:center;min-height:44px;
  }
  nav a:hover{opacity:1;}

  /* 32px, matching the cluster pages. Set by eye, not by the scale: the name's
     cap is 0.256 of the lockup's height, so this renders it at 8.2px — under
     the 12px floor, on purpose, so the lockup reads as one mark rather than as
     a line of type. */
  footer{
    border-top:1px solid var(--line);padding:26px 0 40px;
    display:flex;align-items:center;
  }
  footer .sig{
    display:inline-flex;align-items:center;min-height:44px;text-decoration:none;
    opacity:1;transition:opacity .3s;
  }
  footer .sig:hover{opacity:.6;}
  footer .sig img{display:block;height:32px;width:auto;}

  /* ---------- page shell ---------- */
  header.top{padding:132px 0 64px;}
  h1{
    font-family:"Space Grotesk",Inter,sans-serif;
    font-size:var(--t-head);line-height:1.06;letter-spacing:-.035em;font-weight:600;
    max-width:16ch;
  }

  /* one entry per day. everything below repeats verbatim for day 002. */
  .entry{border-top:1px solid var(--line);padding:34px 0 120px;}
  .entry-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:24px;flex-wrap:wrap;margin-bottom:34px;
  }
  .entry-head h2{
    font-family:"Space Grotesk",Inter,sans-serif;
    font-size:var(--t-sub);font-weight:500;letter-spacing:-.02em;
  }
  /* ---------- 001 · image ---------- */
  /* justified rows: flex-grow is the aspect ratio, so every tile in a row
     resolves to the same height and no image is ever cropped. that matters
     because an uncropped tile makes the expand a pure uniform scale. */
  .gal{display:flex;flex-direction:column;gap:12px;}
  .gal-row{display:flex;gap:12px;}
  /* the tile owns the aspect ratio and the frame is absolute inside it, so the
     morph can animate the frame's box without ever touching page layout. */
  .tile{
    position:relative;flex:var(--ar) 1 0;min-width:0;
    aspect-ratio:var(--ar);z-index:calc(10 - var(--i));
  }

  .frame{
    position:absolute;inset:0;display:block;padding:0;border:0;
    background:var(--sunk);border-radius:var(--r-lg);corner-shape:squircle;
    overflow:hidden;cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
    outline:none;isolation:isolate;
  }
  .frame::before{ /* hairline that survives the scale-up, unlike a border */
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    /* corner-shape does NOT inherit, so `border-radius:inherit` alone left this
       hairline tracing a *round* 20px arc over a squircle-clipped card — two
       different curves at every corner, which read as a double outline. */
    border-radius:inherit;corner-shape:inherit;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .frame img{
    width:100%;height:100%;display:block;object-fit:cover;
    opacity:0;transform:scale(1.04);
    transition:opacity .6s var(--ease-out),transform .9s var(--ease-out);
  }
  .frame.ready img{opacity:1;transform:none;}
  .frame.ready:hover img{transform:scale(1.028);}
  .frame:active img{transform:scale(.995);}

  /* skeleton: a monochrome sheen, removed only once the bitmap has decoded */
  .frame::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,var(--sunk) 30%,#f0f0f3 48%,var(--sunk) 66%);
    background-size:260% 100%;animation:sheen 1.5s linear infinite;
    transition:opacity .5s var(--ease-out);
  }
  .frame.ready::after{opacity:0;animation:none;}
  @keyframes sheen{from{background-position:140% 0;}to{background-position:-140% 0;}}

  /* the only place colour appears at rest-adjacent state: a real focus ring,
     drawn as a masked gradient border so it is a ring and not a glow.
     it lives on the tile, not inside the frame — the frame clips its own
     overflow, which would eat an offset ring entirely. */
  .frame:focus-visible{outline:none;}
  .tile:has(.frame:focus-visible) .ring{opacity:1;}
  .ring{
    position:absolute;inset:-5px;z-index:3;pointer-events:none;opacity:0;
    border-radius:calc(var(--r-lg) + 5px);corner-shape:squircle;
    padding:2px;background:var(--grad);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    transition:opacity .18s var(--ease-out);
  }

  .cap{
    position:absolute;left:12px;bottom:12px;z-index:2;
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px var(--line);
    opacity:0;transform:translateY(6px);
    transition:opacity .28s var(--ease-out),transform .38s var(--ease-out);
  }
  .frame.ready:hover .cap,.frame:focus-visible .cap{opacity:1;transform:none;}
  .cap b{font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--ink);text-transform:none;}

  /* ---------- stage one: the deck ---------- */
  /* the bar keeps a constant 44px so the back button appearing never shifts
     the deck below it. it sits absolutely inside. */
  .stage-bar{position:relative;height:44px;margin-bottom:22px;}
  .stage-bar .back{
    position:absolute;left:0;top:0;
    /* visibility is animatable but discrete: it flips to hidden only at the
       END of the fade out, and back to visible at the START of the fade in.
       that is what takes the faded-out control out of the tab order and the
       a11y tree — opacity:0 alone leaves it focusable, so a keyboard user
       lands on an invisible button. */
    transition:opacity .26s var(--ease-out),transform .38s var(--ease-out),
               visibility 0s linear .26s;
  }
  [data-stage="gallery"] .back{visibility:visible;transition-delay:0s,0s,0s;}
  [data-stage="stack"] .back{opacity:0;transform:translateX(-8px);pointer-events:none;visibility:hidden;}

  /* round controls. the pill is deliberately a true circle/pill — only the
     image surfaces are squircles. */
  .back{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;border:0;border-radius:var(--r-pill);
    background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
    color:var(--ink-2);cursor:pointer;
    -webkit-tap-highlight-color:transparent;outline:none;
  }
  .back:hover{background:var(--line-2);color:var(--ink);}
  .back:active{scale:.94;}
  .back svg{width:18px;height:18px;fill:currentColor;flex:none;}

  .cta-row{
    display:flex;justify-content:center;height:52px;overflow:visible;
    transition:height .5s var(--ease),opacity .3s var(--ease-out);
  }
  [data-stage="gallery"] .cta-row{height:0;opacity:0;pointer-events:none;}
  .cta{
    position:relative;display:inline-flex;align-items:center;gap:12px;
    height:52px;padding:0 6px 0 22px;border:0;border-radius:var(--r-pill);
    background:var(--ink);color:#fff;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:500;letter-spacing:-.005em;
    box-shadow:0 12px 26px -16px rgba(13,13,16,.8);
    -webkit-tap-highlight-color:transparent;outline:none;
    transition:box-shadow .24s var(--ease-out),translate .24s var(--ease-out),scale .18s var(--ease-out);
  }
  .cta:hover{translate:0 -2px;box-shadow:0 20px 34px -16px rgba(13,13,16,.85);}
  .cta:active{scale:.98;translate:0 0;}
  .cta .chev{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:var(--r-pill);background:rgba(255,255,255,.15);
    transition:translate .34s var(--ease-out);
  }
  .cta:hover .chev{translate:3px 0;}
  .cta svg{width:16px;height:16px;fill:currentColor;flex:none;}

  /* same gradient ring as the tiles. these buttons do not clip their overflow,
     so it can sit on the element itself rather than on a wrapper. */
  .back:focus-visible,.cta:focus-visible,.bin:focus-visible{outline:none;}
  .back::after,.cta::after,.bin::after{
    content:"";position:absolute;inset:-5px;z-index:1;pointer-events:none;opacity:0;
    border-radius:var(--r-pill);padding:2px;background:var(--grad);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    transition:opacity .18s var(--ease-out);
  }
  .back:focus-visible::after,.cta:focus-visible::after{opacity:1;}

  /* the deck: one square footprint, cards stacked sideways. each card behind
     steps right and shrinks, so only its right edge reads — the toast-stack
     falloff, laid on its side. */
  [data-stage="stack"] .gal{
    position:relative;display:block;
    width:min(400px,100%);margin:0 auto 56px;aspect-ratio:1;
    /* visible sliver = gap − (width/2)×step. scaling about the centre takes
       half the width loss off each side, so only half works against the gap.
       solve for the sliver, never nudge the gap: gap 16 / step .05 netted 6px
       and the deck read as a single card.
       200×.05 = 10 → gap 46 gives a 36px collapsed sliver. */
    --gap:46px;--step:.05;
  }
  /* 200×.04 = 8 → gap 62 gives a 54px sliver */
  [data-stage="stack"] .gal:hover,[data-stage="stack"] .gal:focus-within{
    --gap:62px;--step:.04;
  }
  /* the cards sit to the RIGHT of the deck box, so the stack is wider than
     .gal by 2 slivers. once the deck stops being 400px and starts filling the
     screen, that surplus runs off the viewport and scrolls the page — so below
     this breakpoint the deck gives the spread its room back. */
  @media (max-width:760px){
    [data-stage="stack"] .gal{width:min(400px,calc(100% - 88px));--gap:30px;}
    [data-stage="stack"] .gal:hover,[data-stage="stack"] .gal:focus-within{--gap:42px;}
  }
  [data-stage="stack"] .gal-row{display:contents;}
  [data-stage="stack"] .tile{
    position:absolute;left:0;top:0;width:100%;height:auto;flex:none;
    aspect-ratio:1;
    /* translate + scale, never rotate: an axis-aligned box means the measured
       rect IS the visual box, which is what keeps the morph exact. scaling
       about the centre insets top and bottom equally, so the depth reads as
       size rather than as a lean. */
    transform-origin:50% 50%;
    transform:translateX(calc(var(--i) * var(--gap))) scale(calc(1 - var(--i) * var(--step)));
    transition:transform .55s var(--ease-out),opacity .45s var(--ease-out);
  }
  /* three cards read at a time. the fourth stays mounted rather than removed
     so it still has a box to fly from when the deck deals out — but it is
     parked directly behind card 2, not one step further out: opacity:0 still
     takes part in layout, so at its own index it silently widened the page's
     scrollWidth past the viewport on small screens. */
  [data-stage="stack"] .tile[data-buried]{
    opacity:0;
    transform:translateX(calc(2 * var(--gap))) scale(calc(1 - 2 * var(--step)));
  }
  [data-stage="stack"] .frame{
    cursor:pointer;
    box-shadow:0 1px 2px rgba(13,13,16,.05),0 6px 16px -4px rgba(13,13,16,.10);
  }
  /* the cards behind are blank stock — only the top one carries a drawing.
     dropping the image rather than the card keeps the hairline edge, and the
     fade back in rides the morph as the deck deals out. */
  [data-stage="stack"] .tile:not([data-lead]) .frame{background:var(--paper);}
  [data-stage="stack"] .tile:not([data-lead]) .frame.ready img{opacity:0;}
  [data-stage="stack"] .tile:not([data-lead]) .cap{display:none;}

  /* flight: for the duration of the morph the tiles leave flow entirely and
     are driven by inline left/top/width/height, so neither layout mode can
     fight the animation. object-fit re-crops each frame on every frame. */
  .stage.morphing .gal{position:relative;}
  .stage.morphing .tile{
    position:absolute;flex:none;transform:none;transition:none;aspect-ratio:auto;
  }
  .stage.morphing .frame{pointer-events:none;}

  /* ---------- expanded ---------- */
  .lb{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;}
  .lb[hidden]{display:none;}
  .scrim{
    position:absolute;inset:0;background:rgba(252,252,253,.86);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  }
  .lb-fig{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .lb-view{
    position:relative;overflow:hidden;background:var(--paper);
    aspect-ratio:var(--ar);
    width:min(calc(100vw - 88px),calc((100vh - 208px) * var(--ar)));
    border-radius:var(--r-lg);corner-shape:squircle;
    box-shadow:inset 0 0 0 1px var(--line),0 40px 80px -40px rgba(13,13,16,.28);
    touch-action:none;cursor:grab;
  }
  .lb-view.grabbing{cursor:grabbing;}
  .lb-view.zoomable{cursor:zoom-in;}
  .lb-img{
    width:100%;height:100%;display:block;object-fit:cover;
    transform-origin:50% 50%;will-change:transform;
    -webkit-user-drag:none;user-select:none;
  }
  .lb-cap{display:flex;align-items:center;gap:14px;}
  .lb-cap b{font-weight:500;font-size:14px;color:var(--ink);}

  /* controls */
  .lb-bar{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;padding:4px;
    border-radius:var(--r-pill);background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:inset 0 0 0 1px var(--line),0 12px 30px -18px rgba(13,13,16,.4);
  }
  .ctl{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:44px;min-height:44px;padding:0 12px;
    border:0;background:none;border-radius:var(--r-pill);
    color:var(--ink-2);cursor:pointer;
    transition:background .18s var(--ease-out),color .18s var(--ease-out);
  }
  .ctl:hover{background:var(--line-2);color:var(--ink);}
  .ctl:disabled{opacity:.32;cursor:default;background:none;}
  .ctl:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;}
  .ctl svg{width:18px;height:18px;fill:currentColor;flex:none;}
  .lb-close{position:absolute;top:22px;right:22px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px var(--line);}

  /* zoom readout — the track only takes colour while the image is engaged */
  .zoom{
    display:flex;align-items:center;gap:10px;padding:0 14px 0 12px;
    min-height:44px;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;letter-spacing:.06em;color:var(--mut);
  }
  .zoom-track{
    position:relative;width:56px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;
  }
  .zoom-fill{
    position:absolute;inset:0;width:56px;transform-origin:0 50%;
    transform:scaleX(var(--z,0));background:var(--grad);
    transition:transform .18s var(--ease-out);
  }
  .zoom b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:34px;}

  /* ---------- 002 · disintegrate ---------- */
  /* the same 400px footprint as 001's deck, so the two entries share a spine.
     two-up inside it reads as a phone library without borrowing a phone. */
  .ph-stage{position:relative;width:min(400px,100%);margin:0 auto;}
  .shelf{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;height:44px;margin-bottom:14px;
  }
  .shelf-l{display:flex;align-items:center;gap:12px;min-width:0;}

  /* undo is a peer of the bin, not of the CTA — same paper-and-hairline
     treatment and the same 44px target, just carrying a label as well. */
  .undo{
    display:inline-flex;align-items:center;gap:8px;
    height:44px;padding:0 16px;border:0;border-radius:var(--r-pill);
    background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
    font:inherit;font-family:ui-monospace,Menlo,monospace;
    font-size:var(--t-label,12px);letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-2);cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;outline:none;
    transition:background .2s var(--ease-out),color .2s var(--ease-out);
  }
  .undo:hover{background:var(--line-2);color:var(--ink);}
  .undo:active{scale:.96;}
  .undo:focus-visible{box-shadow:inset 0 0 0 1px var(--line),0 0 0 3px var(--ink);}
  .undo svg{width:15px;height:15px;fill:currentColor;flex:none;}
  .undo[hidden]{display:none;}

  .bin{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;border:0;border-radius:var(--r-pill);
    background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
    color:var(--ink-2);cursor:pointer;
    -webkit-tap-highlight-color:transparent;outline:none;
    transition:background .2s var(--ease-out),color .2s var(--ease-out);
  }
  .bin:hover:not(:disabled){background:var(--line-2);color:var(--ink);}
  .bin:active:not(:disabled){scale:.94;}
  .bin:disabled{color:var(--mut);cursor:default;}
  .bin svg{
    width:20px;height:20px;flex:none;overflow:visible;
    fill:none;stroke:currentColor;stroke-width:16;
    stroke-linecap:round;stroke-linejoin:round;
  }
  /* the lid hinges at its right end, where the rim meets the can, so it lifts
     the way a pedal bin does rather than sliding off. `fill-box` makes the
     origin the lid group's own bounds instead of the whole 256 viewBox.
     the sign matters and is not the obvious one: SVG's y axis points down, so
     a NEGATIVE rotate swings the free end down through the can. positive is
     the one that opens it. */
  .bin .lid{
    transform-box:fill-box;transform-origin:100% 100%;
    transition:rotate .24s var(--ease-out);
  }
  .bin.open .lid{rotate:22deg;}
  /* the bin answers the fragments landing in it rather than the click that
     sent them, so the pulse is retriggered from the rAF loop. */
  .bin.eat{animation:eat .4s var(--ease-out);}
  @keyframes eat{0%{scale:1;}32%{scale:1.16;}100%{scale:1;}}
  .bin .n{
    position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
    border-radius:var(--r-pill);background:var(--ink);color:#fff;
    font-size:10px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;
    box-shadow:0 0 0 2px var(--paper);
    opacity:0;scale:.5;transform-origin:50% 50%;
    transition:opacity .2s var(--ease-out),scale .3s var(--ease-out);
  }
  .bin[data-n]:not([data-n="0"]) .n{opacity:1;scale:1;}

  /* `align-content:start` is load-bearing, not tidiness. the default is
     `normal`, which for a grid behaves as `stretch`: any height beyond what the
     content needs gets distributed into the AUTO row tracks. the delete
     animates this container's height DOWN (751 -> 497), so for the whole
     animation it is taller than its content and the rows are pulled ~85px
     apart, converging only at the end — on top of a FLIP that was measured
     against the settled layout. that rubber-band is what read as a zoom.
     undo animates the height UP, is never taller than its content, and so was
     always clean. `start` parks the slack at the bottom instead, which is where
     a shrinking grid should put it. */
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
  .cell{position:relative;aspect-ratio:4 / 5;}
  .ph{
    position:absolute;inset:0;display:block;padding:0;border:0;
    background:var(--sunk);border-radius:var(--r-md);corner-shape:squircle;
    overflow:hidden;cursor:pointer;
    -webkit-tap-highlight-color:transparent;outline:none;isolation:isolate;
  }
  .ph::before{ /* same hairline as 001 — and the same corner-shape:inherit,
                  or it traces a round arc over a squircle and doubles up */
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    border-radius:inherit;corner-shape:inherit;
    box-shadow:inset 0 0 0 1px var(--line);
    transition:box-shadow .22s var(--ease-out);
  }
  .ph[aria-pressed="true"]::before{box-shadow:inset 0 0 0 3px var(--ink);}
  .ph img{
    width:100%;height:100%;display:block;object-fit:cover;opacity:0;
    /* monochrome, always. selection is carried by the border and the tick, not
       by colour and not by a zoom — the photo itself never moves. */
    filter:grayscale(1);
    transition:opacity .5s var(--ease-out);
  }
  .ph.ready img{opacity:1;}

  .tick{
    position:absolute;right:8px;bottom:8px;z-index:3;
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(13,13,16,.16);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .22s var(--ease-out),box-shadow .22s var(--ease-out),
               opacity .16s linear,scale .26s var(--ease-out);
  }
  .tick svg{width:12px;height:12px;fill:#fff;opacity:0;transition:opacity .18s var(--ease-out);}
  .ph[aria-pressed="true"] .tick{background:var(--ink);box-shadow:none;scale:1.1;}
  .ph[aria-pressed="true"] .tick svg{opacity:1;}

  /* the chrome leaves first, so what burns is the photograph and not a photo
     still wearing a 3px border and a floating tick. */
  .ph.going::before{box-shadow:inset 0 0 0 3px rgba(13,13,16,0);}
  .ph.going .tick{opacity:0;scale:.6;}

  .ph:focus-visible{outline:none;}
  .cell:has(.ph:focus-visible) .ring{opacity:1;}
  .ring-sm{border-radius:calc(var(--r-md) + 5px);}

  /* the fragments fly past the grid and into the bin, so the canvas has to
     span the whole stage, not just the photos. */
  .px{position:absolute;inset:0;z-index:6;pointer-events:none;display:none;}
  .px.on{display:block;}

  .ph-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;min-height:200px;
    opacity:0;transition:opacity .4s var(--ease-out);
  }
  .ph-empty.on{opacity:1;}
  .ph-empty[hidden]{display:none;} /* the author display:flex would beat the UA rule */
  .cta-sm{height:44px;padding:0 22px;font-size:14px;}

  @media (max-width:900px){
    :root{--t-head:40px;--t-sub:20px;--t-body:17px;}
    .wrap{padding:0 24px;}
    /* The bar's gutter has to track .wrap's, or the mark stops sharing a left
       edge with the content under it. 24px here, not the cluster's 22px,
       because this page's own .wrap is 24. */
    nav{padding:12px 24px;}
    header.top{padding:96px 0 48px;}
    /* stacked rows put flex on the block axis, where flex-basis:0 would win
       over aspect-ratio and collapse every tile to zero height. */
    .gal-row{flex-direction:column;}
    [data-stage="gallery"] .gal-row .tile{flex:none;width:100%;}
    .lb-view{width:calc(100vw - 32px);}
    .lb-bar{bottom:16px;}
  }

  /* The cluster pages drop the bar to 53px below 640 (4px padding on a 44px
     target). Matching that here keeps one header height across the whole
     site on a phone; only the gutter differs, because this page's does. */
  @media (max-width:640px){
    nav{padding:4px 24px;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      /* delay must go too, not just duration: the stage controls hand off
         visibility on a delay timed to the fade, and with no fade left to
         cover it that delay strands a focusable invisible button. */
      transition-delay:0s !important;animation-delay:0s !important;
    }
    .frame img{transform:none !important;}
  }
</style>

<script>
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  var EASE = 'cubic-bezier(.32,.72,0,1)';

  /* ---- skeleton removal: wait for the decode, not the load event, or the
     first paint of a 2000px bitmap lands after the fade has already run ---- */
  var frames = [].slice.call(document.querySelectorAll('.frame'));
  frames.forEach(function (f) {
    var img = f.querySelector('img');
    var ready = function () { f.classList.add('ready'); };   // idempotent

    function settle() {
      if (!img.decode) return ready();
      img.decode().then(ready, ready);
      // chrome defers decode() indefinitely while the document is not being
      // rendered (background tab, prerender), so it can never be the only way
      // out of the skeleton — the image is already loaded by this point.
      setTimeout(ready, 500);
    }

    if (img.complete) {
      settle();
    } else {
      img.addEventListener('load', settle);
      img.addEventListener('error', ready);
    }
  });

  /* ---- stage one → stage two ----------------------------------------------
     the deck and the gallery are two different layout modes (absolute square
     footprint vs justified flex rows), so neither can animate into the other
     in place. instead: measure, switch the mode, measure again, then lift the
     tiles out of flow onto inline left/top/width/height and animate the two
     sets of rects into each other. baking the scale into width/height rather
     than into a transform matters — a square becoming a 2.3:1 panorama under
     a non-uniform scale would visibly squash the drawing, whereas resizing the
     box lets object-fit re-crop it correctly on every frame. */
  var stage = document.getElementById('stage'),
      gal = document.getElementById('gal'),
      tiles = [].slice.call(document.querySelectorAll('.tile')),
      cta = document.getElementById('cta'),
      back = document.getElementById('back');

  var busy = false;

  function syncStage() {
    var stacked = stage.dataset.stage === 'stack';
    // in the deck the cards are one decorative object; the button underneath
    // is the only control, so nothing in the deck takes focus or a name.
    tiles.forEach(function (t, i) {
      t.setAttribute('aria-hidden', stacked ? 'true' : 'false');
      frames[i].tabIndex = stacked ? -1 : 0;
    });
  }
  syncStage();

  /* the deck is translate + scale only, so it stays axis-aligned and a measured
     rect is exactly the visual box in both stages — no correction needed. */
  function geom() {
    return tiles.map(function (t) { return t.getBoundingClientRect(); });
  }

  function morph(next, done) {
    if (busy || stage.dataset.stage === next) return;
    busy = true;

    var first = geom();
    var fh = gal.getBoundingClientRect().height;
    var fm = parseFloat(getComputedStyle(gal).marginBottom) || 0;

    stage.dataset.stage = next;
    syncStage();

    var last = geom();
    var g = gal.getBoundingClientRect();
    var lh = g.height;
    var lm = parseFloat(getComputedStyle(gal).marginBottom) || 0;

    // lift into flight, seeded at the from-rects so there is no flash
    stage.classList.add('morphing');
    gal.style.height = fh + 'px';
    gal.style.marginBottom = fm + 'px';
    tiles.forEach(function (t, i) {
      var a = first[i];
      t.style.left = (a.left - g.left) + 'px';
      t.style.top = (a.top - g.top) + 'px';
      t.style.width = a.width + 'px';
      t.style.height = a.height + 'px';
    });

    var d = reduce.matches ? 1 : 560;
    // deal out from the top of the deck, gather back in from the bottom
    var order = next === 'gallery' ? [0, 1, 2, 3] : [3, 2, 1, 0];

    var runs = [gal.animate(
      [{ height: fh + 'px', marginBottom: fm + 'px' },
       { height: lh + 'px', marginBottom: lm + 'px' }],
      { duration: d, easing: EASE, fill: 'both' }
    )];

    var pending = tiles.length;
    tiles.forEach(function (t, i) {
      var a = first[i], b = last[i];
      var an = t.animate(
        [{ left: (a.left - g.left) + 'px', top: (a.top - g.top) + 'px', width: a.width + 'px', height: a.height + 'px' },
         { left: (b.left - g.left) + 'px', top: (b.top - g.top) + 'px', width: b.width + 'px', height: b.height + 'px' }],
        { duration: d, delay: reduce.matches ? 0 : order.indexOf(i) * 50, easing: EASE, fill: 'both' }
      );
      runs.push(an);
      an.onfinish = function () {
        if (--pending) return;
        // cancel before clearing: fill:'both' would otherwise pin the last
        // keyframe over the stylesheet forever.
        runs.forEach(function (r) { r.cancel(); });
        gal.style.height = '';
        gal.style.marginBottom = '';
        tiles.forEach(function (x) {
          // never removeAttribute('style') — --ar/--i/--sgn live there too
          x.style.left = x.style.top = x.style.width = x.style.height = '';
        });
        stage.classList.remove('morphing');
        busy = false;
        if (done) done();
      };
    });
  }

  cta.addEventListener('click', function () {
    morph('gallery', function () { frames[0].focus({ preventScroll: true }); });
  });
  back.addEventListener('click', function () {
    morph('stack', function () { cta.focus({ preventScroll: true }); });
  });

  /* ---- expanded view ---- */
  var lb = document.getElementById('lb'),
      view = document.getElementById('lbView'),
      lbImg = document.getElementById('lbImg'),
      lbIdx = document.getElementById('lbIdx'),
      lbTitle = document.getElementById('lbTitle'),
      zFill = document.getElementById('zFill'),
      zVal = document.getElementById('zVal'),
      btnPrev = document.getElementById('lbPrev'),
      btnNext = document.getElementById('lbNext'),
      btnIn = document.getElementById('lbIn'),
      btnOut = document.getElementById('lbOut'),
      btnClose = document.getElementById('lbClose');

  var MAX = 5, index = -1, origin = null, anim = null;
  var s = 1, tx = 0, ty = 0;

  function apply(animate) {
    lbImg.style.transition = animate ? 'transform .34s ' + EASE : 'none';
    lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    zVal.textContent = s.toFixed(1) + '\u00d7';
    // fill maps 1× → empty, MAX → full
    zFill.style.setProperty('--z', ((s - 1) / (MAX - 1)).toFixed(3));
    view.classList.toggle('zoomable', s === 1);
    btnOut.disabled = s <= 1.001;
    btnIn.disabled = s >= MAX - 0.001;
  }

  // pan is clamped to the image's own edges: at 1× there is nothing to pan.
  function clamp() {
    var r = view.getBoundingClientRect();
    var mx = Math.max(0, (r.width * s - r.width) / 2);

    var y = Math.min(Math.max(window.scrollY, 0), Math.max(max, 0));
    /* measured every frame rather than cached — these pages grow as images
       decode, and a stale height puts the 5% mark in the wrong place */
    var pin = document.documentElement.scrollHeight * PIN;
    var delta = y - last;

    if(y <= pin){
      nav.classList.remove('is-tucked');
      last = y;
      return;
    }
    /* last only advances on a move we acted on, so a slow drag accumulates
       to the threshold instead of being thrown away a frame at a time. */
    if(Math.abs(delta) > DEADZONE){
      nav.classList.toggle('is-tucked', delta > 0);
      last = y;
    }
  }

  addEventListener('scroll', function () {
    if (!queued) { queued = true; requestAnimationFrame(apply); }
  }, { passive: true });
  apply();
})();
</script>
</body>
</html>
